name: CI (all)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Contains heavy tests, therefore it is run manually"
        required: false
        default: "manual run"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Full Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run full test suite (with distanceFinderTests) with coverage
        run: ./gradlew check --no-daemon -PrunDistanceFinderTests

      - name: Build plugin
        run: ./gradlew :ru-bizgen-plugin:buildPlugin -x test --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: kover-html-report
          path: ${{ github.workspace }}/build/reports/kover/html

      - name: Build documentation (Dokka)
        run: ./gradlew dokkaGenerateHtml --no-daemon
