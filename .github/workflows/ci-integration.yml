name: CI Integration Tests (UI)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Runs heavy UI integration tests (IDE startup + Driver). ~6-10 min."
        required: false
        default: "manual run"
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: UI Integration Tests (Starter + Driver)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache IDE test builds
        uses: actions/cache@v6
        with:
          path: |
            out/ide-tests/cache/builds
            out/ide-tests/cache/tools
          key: ide-test-builds-IC-2024.3-${{ runner.os }}-v1
          restore-keys: |
            ide-test-builds-IC-2024.3-${{ runner.os }}-

      - name: Install xvfb (display server for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run integration tests
        run: xvfb-run -a ./gradlew :ru-bizgen-plugin:integrationTest -PrunIntegrationTests --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            ru-bizgen-plugin/build/test-results/integrationTest
            ru-bizgen-plugin/build/reports/tests/integrationTest
            out/ide-tests/tests/*/log/screenshots
            out/ide-tests/tests/*/log/idea.log
          if-no-files-found: warn
