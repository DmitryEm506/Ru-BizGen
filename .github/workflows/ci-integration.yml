name: CI Integration Tests (UI)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Runs heavy UI integration tests (IDE startup + Driver). ~6-10 min."
        required: false
        default: "manual run"
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: UI Integration Tests (Starter + Driver)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Версия IDE выводится из version проекта (1.12.261 -> 2026.1), см. ru-bizgen-plugin/build.gradle.kts.
      # Ключ кэша должен следовать за ней, иначе после смены платформы кэш промахивается каждую ночь.
      - name: Resolve target IDE version
        id: ide
        run: |
          VERSION=$(grep -m1 '^version = ' build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          BUILD_NUMBER=$(echo "$VERSION" | awk -F. '{print $NF}' | cut -c1-3)
          IDE_VERSION="20${BUILD_NUMBER:0:2}.${BUILD_NUMBER:2:1}"
          echo "version=$IDE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Целевая версия IDE: $IDE_VERSION (из версии проекта $VERSION)"

      - name: Cache IDE test builds
        uses: actions/cache@v6
        with:
          path: |
            out/ide-tests/cache/builds
            out/ide-tests/cache/tools
          key: ide-test-builds-${{ steps.ide.outputs.version }}-${{ runner.os }}-v2
          restore-keys: |
            ide-test-builds-${{ steps.ide.outputs.version }}-${{ runner.os }}-

      - name: Install xvfb (display server for UI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run integration tests
        run: xvfb-run -a ./gradlew :ru-bizgen-plugin:integrationTest -PrunIntegrationTests --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            ru-bizgen-plugin/build/test-results/integrationTest
            ru-bizgen-plugin/build/reports/tests/integrationTest
            out/ide-tests/tests/*/log/screenshots
            out/ide-tests/tests/*/log/idea.log
          if-no-files-found: warn
