name: CI Main (fast)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Fast Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run fast tests with coverage
        run: ./gradlew check --no-daemon

      - name: Build plugin
        run: ./gradlew :ru-bizgen-plugin:buildPlugin -x test --no-daemon

      # IntelliJ Plugin Verifier на границах заявленного диапазона совместимости
      # (sinceBuild = 242 и целевая сборка) — см. pluginVerification
      # в ru-bizgen-plugin/build.gradle.kts. Ловит несовместимости API, которых
      # не видно ни на компиляции, ни в тестах: плагин собирается под одну версию
      # платформы, а объявлен совместимым со всем диапазоном.
      - name: Verify plugin
        run: ./gradlew :ru-bizgen-plugin:verifyPlugin --no-daemon

      - name: Upload plugin verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: ${{ github.workspace }}/ru-bizgen-plugin/build/reports/pluginVerifier
          if-no-files-found: ignore

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: kover-html-report
          path: ${{ github.workspace }}/build/reports/kover/html